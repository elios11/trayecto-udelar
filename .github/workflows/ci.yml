name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run security:repo
      - run: npm run verify
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: trayecto-portable-build
          path: outputs/portable
          if-no-files-found: error
